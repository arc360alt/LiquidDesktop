# Compositor settings for the LiquidDesktop session.
# picom provides the real blur behind Liquid Glass (Dock, menu bar, Control Center…) on top of
# *any* window, plus rounded corners and soft shadows on app windows.
backend = "glx";
vsync = true;
# NVIDIA's own driver: liquid-desktop-session adds --xrender-sync-fence and --no-use-damage when NVIDIA's GLX
# drives the screen (a config file can't depend on the GPU). Without them, windows can stay black or never appear.
use-damage = true;

shadow = true;
shadow-radius = 32;
shadow-opacity = 0.34;
shadow-offset-x = -30;
shadow-offset-y = -18;

fading = true;
fade-in-step = 0.09;
fade-out-step = 0.09;

corner-radius = 22;

blur-method = "dual_kawase";
blur-strength = 7;
blur-background = false;

rules: ({
  # The shell layer (menu bar, Dock, popovers) is a transparent fullscreen window. It is not blurred
  # itself — the window manager puts an invisible "blur window" behind each glass surface instead.
  match = "name = 'LiquidDesktop Shell'";
  blur-background = false;
  shadow = false;
  corner-radius = 0;
  fade = false;
}, {
  match = "name ^= 'LiquidBlur'";
  blur-background = true;
  shadow = false;
  fade = false;
}, {
  match = "name = 'LiquidBlur r0'";
  corner-radius = 0;
}, {
  match = "name = 'LiquidBlur r6'";
  corner-radius = 6;
}, {
  match = "name = 'LiquidBlur r10'";
  corner-radius = 10;
}, {
  match = "name = 'LiquidBlur r14'";
  corner-radius = 14;
}, {
  match = "name = 'LiquidBlur r18'";
  corner-radius = 18;
}, {
  match = "name = 'LiquidBlur r22'";
  corner-radius = 22;
}, {
  match = "name = 'LiquidBlur r26'";
  corner-radius = 26;
}, {
  match = "name = 'LiquidBlur r30'";
  corner-radius = 30;
}, {
  match = "name = 'LiquidBlur r36'";
  corner-radius = 36;
}, {
  match = "name = 'LiquidDesktop Desktop'";
  shadow = false;
  corner-radius = 0;
  fade = false;
}, {
  # built-in app windows: translucent parts (glass terminal, calculator) get real blur
  match = "(class_g = 'liquid-desktop' || class_g = 'LiquidDesktop' || class_i = 'liquid-desktop') && name != 'LiquidDesktop Shell' && name != 'LiquidDesktop Desktop'";
  blur-background = true;
}, {
  match = "window_type = 'menu' || window_type = 'dropdown_menu' || window_type = 'popup_menu' || window_type = 'combo' || window_type = 'tooltip' || window_type = 'dnd'";
  corner-radius = 8;
}, {
  # apps that draw their own shadows (GTK client-side decorations)
  match = "_GTK_FRAME_EXTENTS@";
  shadow = false;
  corner-radius = 0;
})
