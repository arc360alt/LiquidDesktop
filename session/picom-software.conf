# Compositor settings for the LiquidDesktop session WITHOUT a usable GPU (software rendering: llvmpipe, VMs
# without virgl, or LIQUID_SOFTWARE_RENDERING=1). Picked automatically by liquid-desktop-session; the normal
# GPU settings are in picom.conf.
#
# The xrender backend can't do blur or shaders, and its vsync doesn't line up with anything on llvmpipe (frames
# get drawn half-done: parts of the screen flash). So: no blur, no vsync, damage tracking on (only redraw what
# changed), no fading (every fade step is a full redraw done by the CPU). Rounded corners still work on xrender;
# shadows are kept small, since on the CPU they cost a lot.
# LIQUID_PICOM_ARGS (e.g. "--backend xrender") is still added on top by the session.
backend = "xrender";
vsync = false;
use-damage = true;

shadow = true;
shadow-radius = 14;
shadow-opacity = 0.28;
shadow-offset-x = -14;
shadow-offset-y = -8;

fading = false;

corner-radius = 22;

rules: ({
  # the shell layer (menu bar, Dock, popovers): a transparent fullscreen window
  match = "name = 'LiquidDesktop Shell'";
  shadow = false;
  corner-radius = 0;
}, {
  match = "name ^= 'LiquidBlur'";
  shadow = false;
  corner-radius = 0;
}, {
  match = "name = 'LiquidDesktop Desktop'";
  shadow = false;
  corner-radius = 0;
}, {
  match = "window_type = 'menu' || window_type = 'dropdown_menu' || window_type = 'popup_menu' || window_type = 'combo' || window_type = 'tooltip' || window_type = 'dnd'";
  corner-radius = 8;
}, {
  # apps that draw their own shadows (GTK client-side decorations)
  match = "_GTK_FRAME_EXTENTS@";
  shadow = false;
  corner-radius = 0;
})
