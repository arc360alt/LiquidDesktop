# Publishes the browser demo of LiquidDesktop on every push to main, to the "gh-pages" branch (created
# automatically the first time). The site is built from the DE's own files (renderer/), so it always matches
# the latest version; it adds only the few packages the web UI loads (fonts and the terminal), which aren't
# committed (node_modules), and the landing page web/index.html. Nothing in the DE itself is changed.
#
# It pushes with the token GitHub Actions gives every run; the "permissions" below let that token write to
# the repository, so no personal token or secret is needed.
#
# One-time setup on GitHub: Settings › Pages › Build and deployment › Source: "Deploy from a branch",
# Branch: "gh-pages", folder "/ (root)". The demo is then at https://arc360alt.github.io/LiquidDesktop/
name: GitHub Pages demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # create / update the gh-pages branch

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # runtime packages only, without Electron and without install scripts
      - name: Install the web UI's packages
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Assemble the site
        run: |
          set -e
          mkdir -p _site/node_modules/@fontsource-variable
          cp -r renderer _site/renderer
          cp -r node_modules/@xterm _site/node_modules/@xterm
          cp -r node_modules/@fontsource-variable/inter _site/node_modules/@fontsource-variable/inter
          mkdir -p _site/web
          cp web/index.html _site/index.html
          cp web/index.html _site/web/index.html   # the old address keeps working
          # don't let Pages run Jekyll (it would skip node_modules)
          touch _site/.nojekyll

      - name: Publish to the gh-pages branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -e
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Demo of ${GITHUB_SHA::7}"
          # one commit holding just the site, replacing the previous one (the branch never grows)
          git push -f -q "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Published https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
